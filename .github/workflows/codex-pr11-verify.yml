name: PR 11 disposable verification

on:
  push:
    branches:
      - codex/hosted-readiness-followup

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tests/chat-read-before-profile.integration.mjs
      - run: MOMO_CHAT_LOAD_CLIENTS=20 node tests/realtime.integration.mjs
