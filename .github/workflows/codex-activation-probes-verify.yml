name: Activation probe verification

on:
  push:
    branches:
      - codex/activation-probes

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node --check tests/hosted-turnstile-probe.mjs
      - run: node --check tests/hosted-image-access-probe.mjs
      - run: pnpm exec eslint tests/hosted-turnstile-probe.mjs tests/hosted-image-access-probe.mjs
      - run: node --experimental-strip-types tests/seat-turnstile.integration.mjs
      - run: node --experimental-strip-types tests/image-sanitizer.integration.mjs
      - run: node --experimental-strip-types tests/storage.integration.mjs
      - run: pnpm lint
