name: Operations readiness verification

on:
  push:
    branches:
      - codex/operations-readiness

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --check tests/hosted-firewall-probe.mjs
      - run: pnpm exec eslint tests/hosted-firewall-probe.mjs
      - run: pnpm lint
